name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:2
      - name: Download pinned Composer PHAR for native checks
        shell: bash
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          curl -fSL --retry 2 https://getcomposer.org/download/2.10.3/composer.phar -o phpm-composer.phar
          printf '%s\n' '7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6  phpm-composer.phar' | sha256sum -c -
      - name: Build CLI for subprocess tests
        run: go build -o bin/phpm-test.exe ./cmd/phpm
      - name: Test with native PHP
        env:
          PHPM_TEST_PHP_BINARY: php
          PHPM_TEST_CLI_BINARY: ${{ github.workspace }}/bin/phpm-test.exe
          PHPM_TEST_COMPOSER: ${{ runner.temp }}/phpm-composer.phar
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Verify bootstrap archive rejection cases
        if: runner.os == 'Linux'
        run: |
          python3 scripts/test_install_phpm.py
          python3 -m unittest discover -s build/release -p 'test_*.py'
          python3 -m unittest discover -s build/linux/tests -v
          for debian in 12 13; do
            for php in 8.4 8.5; do
              python3 build/linux/build.py check --debian "$debian" --php "$php"
            done
          done

  linux-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Bootstrap managed PHP without a preinstalled interpreter
        shell: bash
        run: |
          set -eu
          stage=$(mktemp -d)
          go build -o "$stage/phpm" ./cmd/phpm
          go test -c -o "$stage/phpm.test" ./internal/phpm
          cp scripts/test-linux-prebuilt.sh "$stage/run-tests.sh"
          mkdir "$stage/fixtures"
          curl -fSL --retry 2 https://getcomposer.org/download/2.10.3/composer.phar -o "$stage/fixtures/composer.phar"
          cd "$stage"
          printf '%s\n' '7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6  fixtures/composer.phar' | sha256sum -c -
          sha256sum phpm phpm.test run-tests.sh fixtures/composer.phar > SHA256SUMS
          sh run-tests.sh --bootstrap

  signed-default-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        debian: ['12', '13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build client and prepare matching fresh Debian runtime
        id: context
        env:
          DEBIAN_VERSION: ${{ matrix.debian }}
          CGO_ENABLED: '0'
          GOAMD64: v1
        run: |
          go build -trimpath -o "$RUNNER_TEMP/phpm" ./cmd/phpm
          python3 - <<'PY'
          import os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, 'build/linux')
          from common import load_recipe, recipe_filename
          debian = os.environ['DEBIAN_VERSION']
          recipe = load_recipe(Path('build/linux'), recipe_filename('8.4', debian))
          context = Path(os.environ['RUNNER_TEMP']) / 'signed-default-context'
          context.mkdir()
          for source, name in [('build/linux/default-source.Dockerfile', 'Dockerfile'),
              ('build/linux/runtime-packages.txt', 'runtime-packages.txt'),
              ('build/linux/runtime-packages-debian12.txt', 'runtime-packages-debian12.txt'),
              ('scripts/test-default-source.sh', 'test-default-source.sh'),
              (str(Path(os.environ['RUNNER_TEMP']) / 'phpm'), 'phpm')]:
              shutil.copyfile(source, context / name)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('base_image=' + recipe['base_image'] + '\n')
          PY
      - name: Install from signed defaults and test extensions, upgrade and rollback
        env:
          BASE_IMAGE: ${{ steps.context.outputs.base_image }}
          DEBIAN_VERSION: ${{ matrix.debian }}
        run: |
          docker build --platform linux/amd64 --build-arg "BASE_IMAGE=$BASE_IMAGE" --build-arg "DEBIAN_VERSION=$DEBIAN_VERSION" -t phpm-default-test "$RUNNER_TEMP/signed-default-context"
          docker run --rm --cap-drop ALL --security-opt no-new-privileges -e "PHPM_EXPECTED_TARGET=debian${DEBIAN_VERSION}-x86_64-nts" phpm-default-test
