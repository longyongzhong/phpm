name: Debian PHP source build (stage A)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate pinned recipe and build helpers
        run: |
          python3 build/linux/build.py check
          python3 -m unittest discover -s build/linux/tests -v
      - name: Build packages and run SDK/fresh-container checks
        run: python3 build/linux/build.py build --output "$RUNNER_TEMP/phpm-debian13-build"
      - name: Retain unpublished packages and verification reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phpm-debian13-source-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phpm-debian13-build/
          if-no-files-found: error
          retention-days: 14
